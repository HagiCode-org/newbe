name: Update mirror

on:
  push:
    branches:
      - mirror
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Delete existing mirror results and sync state before rebuilding"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: mirror-update
  cancel-in-progress: false

env:
  PUBLISH_BRANCH: main

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Publish always targets main; push:main stays disabled to avoid self-trigger loops.
      - name: Checkout source ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Init Pipenv CLI and run
        working-directory: ${{ github.workspace }}/tools
        env:
          FULL_REFRESH: ${{ inputs.full_refresh || false }}
          # Authenticate the GitHub API so the unauthenticated 60/hr rate limit
          # no longer truncates/blanks generated mirror docs mid-run.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$FULL_REFRESH" = "true" ]; then
            echo "Running full mirror refresh from GitHub releases and manifests."
            rm -f "$GITHUB_WORKSPACE"/docs/Mirrors/*.md
            rm -f "$GITHUB_WORKSPACE"/tools/tools/123pan-sync-state.json
          fi
          export PATH=/home/runner/.local/bin/:$PATH
          pip install --upgrade pip
          pip install pipenv
          pipenv install
          pipenv run invoke create-mirrors

      - name: Capture mirror diff
        id: diff
        shell: bash
        run: |
          set -euo pipefail

          PATCH_FILE="$RUNNER_TEMP/mirror-update.patch"

          git add -N .

          if git diff --quiet -- .; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Mirror publish"
              echo "- Result: no-op"
              echo "- Publish branch: $PUBLISH_BRANCH"
              echo "- Source ref: $GITHUB_REF_NAME"
            } >> "$GITHUB_STEP_SUMMARY"
            rm -f "$PATCH_FILE"
            exit 0
          fi

          git diff --binary --full-index -- . > "$PATCH_FILE"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "patch_file=$PATCH_FILE" >> "$GITHUB_OUTPUT"

          {
            echo "### Mirror publish"
            echo "- Result: changes detected"
            echo "- Publish branch: $PUBLISH_BRANCH"
            echo "- Source ref: $GITHUB_REF_NAME"
            echo "- Pending files:"
            echo '```text'
            git status --short
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark downstream actions as skipped for no-op
        if: steps.diff.outputs.changed != 'true'
        shell: bash
        run: |
          {
            echo "### Release follow-up"
            echo "- Result: skipped (no-op publish)"
            echo "- Trigger branch: $PUBLISH_BRANCH"
            echo "- Note: no commit was pushed to main, so the main-branch release workflow was not triggered."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish mirror updates to main
        id: publish
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATCH_FILE: ${{ steps.diff.outputs.patch_file }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "GITHUB_TOKEN is required to push ${PUBLISH_BRANCH}." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git reset --hard HEAD
          git clean -fd
          git fetch origin "$PUBLISH_BRANCH"
          git checkout -B mirror-publish "origin/$PUBLISH_BRANCH"
          git apply --index --binary "$PATCH_FILE"

          if git diff --cached --quiet; then
            echo "Mirror patch produced no staged changes on ${PUBLISH_BRANCH}." >&2
            exit 1
          fi

          git commit -m "chore(mirror): update managed mirrors"
          git push origin HEAD:"$PUBLISH_BRANCH"

          COMMIT_SHA="$(git rev-parse HEAD)"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

          {
            echo "- Result: published"
            echo "- Commit: \`$COMMIT_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record release follow-up
        if: steps.publish.outputs.published == 'true'
        shell: bash
        run: |
          {
            echo "### Release follow-up"
            echo "- Result: delegated to main push"
            echo "- Trigger branch: $PUBLISH_BRANCH"
            echo "- Commit: \`${{ steps.publish.outputs.commit_sha }}\`"
            echo "- Note: the gh-pages workflow is dispatched explicitly after the main push."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger gh-pages deployment workflow
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run newbe-deploy-gh-pages.yml --ref "${PUBLISH_BRANCH}"